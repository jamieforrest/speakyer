[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speakyer"
version = "0.1.0"
description = "Podcast vocabulary learning: transcribe, extract, and create Anki flashcards"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "mlx-whisper>=0.4",
    "spacy>=3.7",
    "feedparser>=6.0",
    "genanki>=0.13",
    "requests>=2.31",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
# Audio clip extraction — required for v1.1
audio = ["pydub>=0.25"]

[project.scripts]
speakyer = "speakyer.cli:main"

[project.urls]
Repository = "https://github.com/jamieforrest/speakyer"

[tool.hatch.build.targets.wheel]
packages = ["speakyer"]
